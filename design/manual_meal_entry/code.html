<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>EBTracker - Log Meal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-tertiary-fixed-variant": "#6a3b00",
                    "surface-container": "#eeedf3",
                    "on-secondary": "#ffffff",
                    "surface-container-highest": "#e3e2e7",
                    "secondary": "#006e28",
                    "secondary-fixed-dim": "#53e16f",
                    "outline": "#717786",
                    "on-surface-variant": "#414755",
                    "on-secondary-fixed-variant": "#00531c",
                    "tertiary-fixed": "#ffdcbf",
                    "error": "#ba1a1a",
                    "surface-bright": "#faf9fe",
                    "on-tertiary-container": "#fffbff",
                    "on-error-container": "#93000a",
                    "background": "#faf9fe",
                    "surface-container-low": "#f4f3f8",
                    "surface-tint": "#005bc1",
                    "on-secondary-container": "#00732a",
                    "inverse-on-surface": "#f1f0f5",
                    "tertiary-fixed-dim": "#ffb874",
                    "inverse-surface": "#2f3034",
                    "primary-fixed-dim": "#adc6ff",
                    "on-error": "#ffffff",
                    "on-primary-container": "#fefcff",
                    "primary-fixed": "#d8e2ff",
                    "on-primary": "#ffffff",
                    "surface-container-high": "#e9e7ed",
                    "tertiary-container": "#ac6300",
                    "surface-variant": "#e3e2e7",
                    "on-secondary-fixed": "#002107",
                    "on-background": "#1a1b1f",
                    "primary": "#0058bc",
                    "primary-container": "#0070eb",
                    "secondary-container": "#6ffb85",
                    "surface-container-lowest": "#ffffff",
                    "on-primary-fixed": "#001a41",
                    "on-primary-fixed-variant": "#004493",
                    "inverse-primary": "#adc6ff",
                    "surface-dim": "#dad9df",
                    "surface": "#faf9fe",
                    "on-tertiary": "#ffffff",
                    "on-surface": "#1a1b1f",
                    "outline-variant": "#c1c6d7",
                    "secondary-fixed": "#72fe88",
                    "error-container": "#ffdad6",
                    "on-tertiary-fixed": "#2d1600",
                    "tertiary": "#894d00"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "base": "8px",
                    "card-padding": "16px",
                    "margin-mobile": "16px",
                    "gutter": "12px",
                    "stack-gap": "20px"
            },
            "fontFamily": {
                    "display": ["Inter"],
                    "caption": ["Inter"],
                    "headline-lg": ["Inter"],
                    "body-sm": ["Inter"],
                    "label-caps": ["Inter"],
                    "headline-md": ["Inter"],
                    "body-lg": ["Inter"]
            },
            "fontSize": {
                    "display": ["34px", {"lineHeight": "41px", "letterSpacing": "-0.4px", "fontWeight": "700"}],
                    "caption": ["12px", {"lineHeight": "16px", "fontWeight": "400"}],
                    "headline-lg": ["28px", {"lineHeight": "34px", "letterSpacing": "-0.4px", "fontWeight": "700"}],
                    "body-sm": ["15px", {"lineHeight": "20px", "letterSpacing": "-0.2px", "fontWeight": "400"}],
                    "label-caps": ["13px", {"lineHeight": "18px", "letterSpacing": "0.1px", "fontWeight": "600"}],
                    "headline-md": ["22px", {"lineHeight": "28px", "letterSpacing": "-0.4px", "fontWeight": "600"}],
                    "body-lg": ["17px", {"lineHeight": "22px", "letterSpacing": "-0.4px", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            background-color: #F2F2F7; /* Level 0 Background per Style Guidance */
            -webkit-tap-highlight-color: transparent;
        }
        .safe-bottom {
            padding-bottom: calc(env(safe-area-inset-bottom) + 34px);
        }
        .glass {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .ios-shadow {
            box-shadow: 0px 2px 8px rgba(0, 0, 0, 0.04);
        }
        .ios-shadow-lg {
            box-shadow: 0px 4px 16px rgba(0, 0, 0, 0.12);
        }
        /* Custom scroll behavior for suggestions */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="font-body-lg text-on-surface antialiased overflow-x-hidden">
<!-- TopAppBar -->
<header class="sticky top-0 w-full z-40 bg-surface/80 dark:bg-surface-dim/80 backdrop-blur-xl border-b-[0.5px] border-outline-variant/30 flex flex-col px-4 pt-6 pb-2 w-full">
<div class="flex items-center justify-between">
<div class="flex items-center gap-3">

<h1 class="font-display text-headline-md font-bold text-on-surface dark:text-inverse-on-surface">EBTracker</h1>
</div>
<button class="material-symbols-outlined text-primary dark:text-primary-fixed-dim active:opacity-70 transition-opacity active:scale-95 transition-transform duration-150">calendar_today</button>
</div>
</header>
<main class="px-margin-mobile pt-stack-gap pb-40">
<!-- Search Section -->
<div class="relative z-30 mb-8">
<div class="flex items-center bg-white dark:bg-surface-container rounded-xl px-4 py-3 ios-shadow focus-within:ring-2 focus-within:ring-primary/20 transition-all"><span class="material-symbols-outlined text-outline mr-3">search</span><input class="bg-transparent border-none p-0 w-full focus:ring-0 font-body-lg placeholder:text-outline/60" placeholder="Search past meals..." type="text" value="Oatmeal"><span class="material-symbols-outlined text-outline/40 cursor-pointer active:scale-90 transition-transform">cancel</span></div>
<!-- Autocomplete Popover -->
</div>
<!-- Form Section -->
<section class="space-y-6">
<div class="bg-white rounded-2xl p-card-padding ios-shadow">
<h2 class="font-label-caps text-outline mb-4 uppercase tracking-wider text-[11px]">Item Details</h2>
<div class="space-y-5">
<!-- Item Name -->
<div class="space-y-1.5">
<label class="font-label-caps text-on-surface-variant px-1">Item Name</label>
<input class="w-full bg-[#E9E9EB]/50 border-none rounded-lg px-4 py-3 font-body-lg focus:ring-2 focus:ring-primary/20 transition-all" placeholder="Enter food name" type="text" value="Oatmeal">
</div>
<!-- Calories -->
<div class="space-y-1.5">
<label class="font-label-caps text-on-surface-variant px-1">Calories</label>
<div class="relative">
<input autofocus="true" class="w-full bg-[#E9E9EB]/50 border-none rounded-lg px-4 py-3 font-display text-headline-md focus:ring-2 focus:ring-primary/20 transition-all ring-2" placeholder="0" type="number">
<span class="absolute right-4 top-1/2 -translate-y-1/2 text-outline font-label-caps">kcal</span>
</div>
</div>
</div>
</div>
<!-- Meal Type Segmented Control -->
<div class="bg-white rounded-2xl p-card-padding ios-shadow">
<h2 class="font-label-caps text-outline mb-4 uppercase tracking-wider text-[11px]">Meal Type</h2>
<div class="grid grid-cols-2 gap-2 sm:grid-cols-4 bg-[#E9E9EB]/50 p-1 rounded-xl">
<button class="bg-white text-primary font-label-caps py-2.5 rounded-lg shadow-sm border border-black/5 active:scale-95 transition-all">Breakfast</button>
<button class="text-on-surface-variant font-label-caps py-2.5 rounded-lg hover:bg-white/50 active:scale-95 transition-all">Lunch</button>
<button class="text-on-surface-variant font-label-caps py-2.5 rounded-lg hover:bg-white/50 active:scale-95 transition-all">Dinner</button>
<button class="text-on-surface-variant font-label-caps py-2.5 rounded-lg hover:bg-white/50 active:scale-95 transition-all">Snack</button>
</div>
</div>
<!-- Quick Log Card (Asymmetric Layout element) -->
<div class="bg-primary/5 border border-primary/10 rounded-2xl p-card-padding flex items-start gap-4">
<div class="bg-primary/20 p-2 rounded-xl">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">info</span>
</div>
<div>
<h3 class="font-label-caps text-primary">Pro Tip</h3>
<p class="text-caption text-on-primary-fixed-variant mt-1 leading-relaxed">Most logged meals appear in search suggestions. Log your morning oatmeal once to find it instantly tomorrow.</p>
</div>
</div>
</section>
</main>
<!-- Fixed Bottom Actions -->
<div class="fixed bottom-0 left-0 right-0 z-40 bg-surface/80 backdrop-blur-xl border-t-[0.5px] border-outline-variant/30 px-6 pt-4 safe-bottom">
<button class="w-full h-[50px] bg-primary text-white font-headline-md rounded-[12px] shadow-lg active:scale-95 active:bg-primary-container transition-all duration-200 flex items-center justify-center gap-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
            Save Food
        </button>
</div>
<!-- Bottom Navigation Shell -->
<nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface/80 dark:bg-inverse-surface/80 backdrop-blur-xl border-t-[0.5px] border-outline-variant/30 flex justify-around items-center h-[83px] px-6 w-full">
<button class="flex flex-col items-center justify-center text-on-surface-variant/60 dark:text-surface-variant/60 active:bg-surface-variant/10 active:scale-90 transition-all duration-200">
<span class="material-symbols-outlined">dashboard</span>
<span class="font-caption text-caption">Dashboard</span>
</button>
<button class="flex flex-col items-center justify-center text-primary dark:text-secondary-fixed-dim font-semibold active:bg-surface-variant/10 active:scale-90 transition-all duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">add_circle</span>
<span class="font-caption text-caption">Log Food</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant/60 dark:text-surface-variant/60 active:bg-surface-variant/10 active:scale-90 transition-all duration-200">
<span class="material-symbols-outlined">settings</span>
<span class="font-caption text-caption">Settings</span>
</button>
</nav>
<script>
        // Simple Interaction logic for Segmented Control
        document.querySelectorAll('button.font-label-caps').forEach(btn => {
            btn.addEventListener('click', function() {
                // Only for the meal type grid
                if (this.parentElement.classList.contains('grid')) {
                    this.parentElement.querySelectorAll('button').forEach(b => {
                        b.classList.remove('bg-white', 'text-primary', 'shadow-sm', 'border', 'border-black/5');
                        b.classList.add('text-on-surface-variant');
                    });
                    this.classList.add('bg-white', 'text-primary', 'shadow-sm', 'border', 'border-black/5');
                    this.classList.remove('text-on-surface-variant');
                }
            });
        });

        // Toggle suggestion list based on input focus (simplified mock)
        const searchInput = document.querySelector('input[type="text"]');
        const popover = document.querySelector('.absolute.top-full');
        
        searchInput.addEventListener('focus', () => {
            popover.classList.remove('hidden');
        });
        
        // Clicking away hides it (simplified)
        document.addEventListener('click', (e) => {
            if (!searchInput.contains(e.target) && !popover.contains(e.target)) {
                popover.classList.add('hidden');
            }
        });
    </script>


</body></html>
